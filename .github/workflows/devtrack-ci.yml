
name: DevTrack CI Pipeline

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devtrack-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Java Version
        run: java -version

      - name: Verify Maven Version
        run: mvn -version

      - name: Build and Run Tests
        working-directory: backend
        run: mvn -B clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devtrack-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: devtrack-build
          path: |
            backend/target/*.jar
            backend/target/*.war
          if-no-files-found: warn
          retention-days: 7
