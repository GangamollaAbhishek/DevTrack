
name: DevTrack CI Pipeline

# 1. Workflow triggers
on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main

  workflow_dispatch:

# 2. Repository permissions
permissions:
  contents: read

# 3. Avoid duplicate workflow executions
concurrency:
  group: devtrack-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 4. Workflow jobs
jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # Step 1: Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure Java 21
      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Step 3: Verify Java
      - name: Verify Java Version
        run: java -version

      # Step 4: Verify Maven
      - name: Verify Maven Version
        run: mvn -version

      # Step 5: Compile, test and package
      - name: Build and Run Tests
        working-directory: backend
        run: mvn -B clean verify

      # Step 6: Upload test reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devtrack-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      # Step 7: Upload application artifact
      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: devtrack-build
          path: |
            backend/target/*.jar
            backend/target/*.war
          if-no-files-found: warn
          retention-days: 7
